<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Converter Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #111827;
            --border: #1f293d;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --error-red: #ef4444;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
        .wrapper { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 20px; }

        header { background: var(--card-bg); border: 1px solid var(--border); padding: 24px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        header h1 { font-size: 1.6rem; color: #818cf8; }
        header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

        .download-badge { background: #1e1b4b; border: 1px solid #4338ca; color: #a5b4fc; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .download-badge:hover { background: #312e81; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .card h2 { font-size: 1.1rem; color: #f9fafb; border-bottom: 1px solid var(--border); padding-bottom: 10px; }

        .controls { display: flex; flex-direction: column; gap: 10px; }
        select, input, button, textarea { background: #1f2937; border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 6px; font-size: 0.9rem; outline: none; }
        
        /* Rotes Leuchten bei Fehler */
        textarea.has-error {
            border: 2px solid var(--error-red) !important;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
            background: #1a0d0d !important;
        }

        /* Tipp-Box unter dem Editor */
        .tip-box {
            background: #271414;
            border: 1px solid var(--error-red);
            color: #fca5a5;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: none;
        }

        .autocomplete-info {
            font-size: 0.75rem;
            color: var(--accent);
            margin-top: -5px;
        }

        button.btn-primary { background: var(--accent); color: white; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button.btn-primary:hover { background: var(--accent-hover); }

        textarea { height: 140px; font-family: monospace; resize: vertical; transition: all 0.2s ease; }
        .output-box { background: #090d16; border: 1px solid var(--border); padding: 10px; border-radius: 6px; font-size: 0.85rem; min-height: 40px; color: var(--text-muted); word-break: break-all; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <div>
            <h1>Universal Studio Engine</h1>
            <p>Client-side Media & Code Transformation Platform</p>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <a href="UniversalStudio.exe" download class="download-badge">🪟 Windows (.exe)</a>
            <a href="UniversalStudio.apk" download class="download-badge" style="background:#059669; border-color:#10b981;">🤖 Android (.apk)</a>
        </div>
    </header>

    <div class="grid">
        <!-- MODUL 1: CODE TRANSPILER WITH ERROR HIGHLIGHTING & TAB AUTOCOMPLETE -->
        <div class="card">
            <h2>1. Universal Code Transpiler</h2>
            <div class="controls">
                <select id="code-mode" onchange="runTranspiler()">
                    <option value="py2bat">Python (.py) &rarr; BAT (.bat)</option>
                    <option value="bat2py">BAT (.bat) &rarr; Python (.py)</option>
                    <option value="py2c">Python (.py) &rarr; C Code (.c)</option>
                    <option value="json2c">JSON &rarr; C Struct</option>
                    <option value="json2java">JSON &rarr; Java Class</option>
                </select>
                <div class="autocomplete-info">💡 Drücke <strong>[Tab]</strong> für automatische Befehlsvorschläge!</div>
                <textarea id="code-in" placeholder="Code hier eingeben..." oninput="runTranspiler()"></textarea>
                
                <!-- Tipp-Box bei Fehler -->
                <div id="tip-box" class="tip-box"></div>

                <button class="btn-primary" onclick="runTranspiler()">Code Konvertieren</button>
            </div>
            <textarea id="code-out" readonly placeholder="Ergebnis..."></textarea>
        </div>

        <!-- MODUL 2: MEDIA ENGINE -->
        <div class="card">
            <h2>2. Media & Screensaver Engine</h2>
            <div class="controls">
                <input type="file" id="media-file" accept="video/*,audio/*">
                <select id="media-target">
                    <option value="mp4_to_m4a">MP4 &rarr; M4A (Audio Container)</option>
                    <option value="m4a_to_mp4">M4A &rarr; MP4 (Audio Track)</option>
                    <option value="video_to_scr">Video &rarr; Windows Screensaver (.scr)</option>
                    <option value="audio_to_wav">Audio &rarr; WAV (PCM)</option>
                </select>
                <button class="btn-primary" onclick="convertMedia()">Datei Verarbeiten</button>
            </div>
            <div class="output-box" id="media-status">Bereit. Keine Serverübertragung.</div>
            <div id="media-download"></div>
        </div>
    </div>
</div>

<script>
    // Befehls-Bibliothek für Tab-Vorschläge
    const SUGGESTIONS = {
        'py2bat': ['print("Hello")', 'import os', 'set var = 10', 'if __name__ == "__main__":'],
        'bat2py': ['echo Hello', 'set var=10', 'rem Das ist ein Kommentar', 'pause'],
        'json2c': ['{\n  "name": "User",\n  "id": 1\n}']
    };

    const codeIn = document.getElementById('code-in');
    const codeOut = document.getElementById('code-out');
    const tipBox = document.getElementById('tip-box');

    // TAB-TASTE ABFANGEN UND AUTOFILL DURCHFÜHREN
    codeIn.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            const mode = document.getElementById('code-mode').value;
            const currentText = this.value;

            // Suche passenden Befehl aus den Vorschlägen
            const list = SUGGESTIONS[mode] || ['print("Hello")'];
            const match = list.find(s => s.toLowerCase().startsWith(currentText.toLowerCase())) || list[0];

            this.value = match;
            runTranspiler();
        }
    });

    // CODE TRANSPILER WITH SYNTAX ERROR CHECKING
    function runTranspiler() {
        const mode = document.getElementById('code-mode').value;
        const input = codeIn.value;
        let output = "";
        let errorTip = "";

        // Reset Status
        codeIn.classList.remove('has-error');
        tipBox.style.display = 'none';

        if (!input.trim()) {
            codeOut.value = "// Bitte Code eingeben!";
            return;
        }

        try {
            if (mode === 'py2bat') {
                let lines = input.split('\n');
                output = "@echo off\nrem Converted from Python Script\n";

                lines.forEach((l, idx) => {
                    let line = l.trim();
                    if (line.startsWith('print')) {
                        // Syntax-Fehler prüfen (Fehlende Klammern)
                        if (!line.startsWith('print(') || !line.endsWith(')')) {
                            throw new Error(`Zeile ${idx+1}: In Python 3 muss print mit Klammern geschrieben werden!\n💡 Richtig: print("${line.replace('print', '').trim()}")`);
                        }
                        let text = line.replace(/print\((['"])(.*?)\1\)/, '$2');
                        output += `echo ${text}\n`;
                    } else if (line.startsWith('#')) {
                        output += `rem ${line.substring(1)}\n`;
                    } else if (line.includes('=')) {
                        let p = line.split('=');
                        output += `set ${p[0].trim()}=${p[1].trim().replace(/['"]/g, '')}\n`;
                    }
                });
            } 
            else if (mode === 'bat2py') {
                output = "# Converted from Windows Batch\nimport os, sys\n\n";
                input.split('\n').forEach((l, idx) => {
                    let line = l.trim();
                    if (line.toLowerCase().startsWith('echo ')) output += `print("${line.substring(5)}")\n`;
                    else if (line.toLowerCase().startsWith('rem ')) output += `# ${line.substring(4)}\n`;
                    else if (line) output += `os.system("${line}")\n`;
                });
            } 
            else if (mode.startsWith('json2')) {
                // Prüfe ob JSON gültig ist
                try {
                    const obj = JSON.parse(input);
                    output = "typedef struct {\n";
                    for (let k in obj) output += `    ${typeof obj[k] === 'number' ? 'double' : 'char*'} ${k};\n`;
                    output += "} DataStruct;\n";
                } catch (jsonErr) {
                    throw new Error("Ungültiges JSON-Format!\n💡 Richtiges Beispiel: {\"key\": \"value\"}");
                }
            }
            codeOut.value = output;

        } catch (err) {
            // FEHLER ANZEIGEN: Rotes Leuchten & Tipp-Box
            codeIn.classList.add('has-error');
            tipBox.innerText = err.message;
            tipBox.style.display = 'block';
            codeOut.value = "// Konvertierung gestoppt wegen Syntax-Fehler.";
        }
    }

    // Default Code
    codeIn.value = 'print("hello world")';
    runTranspiler();
</script>
</body>
</html>
